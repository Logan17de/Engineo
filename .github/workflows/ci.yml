name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript / web / API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: engineo
          POSTGRES_PASSWORD: engineo
          POSTGRES_DB: engineo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engineo -d engineo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://engineo:engineo@127.0.0.1:5432/engineo
      ENGINEO_SCHEDULER_BIN: ${{ github.workspace }}/target/release/engineo-schedule
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain for API integration
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build the real schedule bridge
        run: |
          cargo build --release --locked -p engineo-scheduling --bin engineo-schedule
          node scripts/generate-time-zones.mjs --check

      - name: Quality checks
        run: pnpm check:ts

      - name: Dependency audit
        run: pnpm audit --audit-level high

  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  rust-security:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit Rust dependencies
        uses: step-security/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
