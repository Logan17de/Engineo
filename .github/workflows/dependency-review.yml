name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Review added dependencies
        uses: actions/dependency-review-action@2f920dad77d7f4f2ea876b66287b896de40dda79 # 5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
