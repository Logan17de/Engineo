name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Review added dependencies
        uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b # 5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
